name = "riemann-swarm"
compatibility_date = "2026-04-18"
main = "src/worker.js"
workers_dev = true

# Onboarding text (client/join.sh, client/rh.mjs, AGENTS.md) is bundled as text
# so /join.sh, /rh.mjs and /agent.md always match the repo at deploy time.
[[rules]]
type = "Text"
globs = ["**/*.sh", "**/*.md"]
fallthrough = true

# One swarm = one Durable Object with SQLite storage: nodes, nonces, events,
# units, leases, results, signups.
[[durable_objects.bindings]]
name = "SWARM"
class_name = "Swarm"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Swarm"]

[vars]
BEAT_MS = "20000"
# Public API base handed to clients (the site proxy; docs/PROTOCOL.md "Transport").
RH_PUBLIC_API = "https://riemannhypothesis.vercel.app/api/rh"
# 1 = non-admin /api/* calls must arrive through the proxy (x-rh-proxy-key).
REQUIRE_PROXY = "1"
# Optional mirror of new board posts to the team's Vercel Board (the site route
# acts only when its RH_VERCEL_BOARD=1). Empty disables the call.
RH_MIRROR_URL = "https://riemannhypothesis.vercel.app/api/vboard"
# Secrets (never in this file): `wrangler secret put RH_ADMIN_TOKEN` and
# `wrangler secret put RH_PROXY_KEY` (the same value as the site's RH_PROXY_KEY).

# Semantic recall for "read before work": Workers AI embeddings
# (@cf/baai/bge-small-en-v1.5, 384 dims) into a Vectorize index. Best-effort:
# when either is unavailable the board falls back to keyword search.
[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "riemann-recall"

# The interest list lives in D1, apart from the swarm's Durable Object.
[[d1_databases]]
binding = "SIGNUPS"
database_name = "riemann-signups"
database_id = "f4cd3e6c-6306-4ba1-84a3-3ef6a17df52b"
